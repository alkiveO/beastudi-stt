services:
  beastudi:
    image: nufian/beastudi:1.0
    container_name: beastudi-dev
    restart: unless-stopped
    tty: true
    env_file: .env
    ports:
      - "4443:443"
    networks:
      - beastudi-dev
    volumes:
      - .:/var/www/html
      - ./docker/php/php-uploads.ini:/usr/local/etc/php/conf.d/99-uploads.ini:ro
    depends_on:
      - db
    # Jalankan scheduler Laravel (termasuk pembersihan temp) tiap menit di latar
    # sebagai www-data, lalu apache di foreground. menggantikan peran cron OS.
    command: >
      /bin/sh -c "nohup su -s /bin/sh www-data -c 'while true; do
      php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done'
      >/dev/null 2>&1 & exec apache2-foreground"

  db:
    image: mysql:8.2
    container_name: beastudi-dev-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Nurul2024!@#
      MYSQL_USER: beastudi
      MYSQL_PASSWORD: Beastudi74n!@#
      MYSQL_DATABASE: db_beastudi
    volumes:
      - beastudi-dev-db:/var/lib/mysql
    networks:
      - beastudi-dev

#Docker Networks
networks:
  beastudi-dev:
    driver: bridge

volumes:
  beastudi-dev-db:
    driver: local
