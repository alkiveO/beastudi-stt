services:
  beastudi:
    image: nufian/apache2-fpm-8.3:1.0 
    container_name: beastudi
    restart: unless-stopped
    tty: true
    env_file: .env
    ports:
      - "443:443"
    networks:
      - beastudi-dev
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.2
    container_name: beastudi-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Nurul2024!@#
      MYSQL_USER: beastudi
      MYSQL_PASSWORD: Beastudi74n!@#
      MYSQL_DATABASE: db_beastudi
    volumes:
      - beastudi-db:/var/lib/mysql
    networks:
      - beastudi-dev

#Docker Networks
networks:
  beastudi-dev:
    driver: bridge

volumes:
  beastudi-db:
    driver: local
