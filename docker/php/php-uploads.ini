; =============================================
; Beastudi — pengaturan upload & sumber daya PHP
; Ditemukan di /usr/local/etc/php/conf.d/ oleh container.
; =============================================
; Batas per file upload (naik dari 2M agar file PDF hasil scan muat).
upload_max_filesize = 8M
; Batas keseluruhan isi satu request POST (harus > upload_max_filesize,
; cukup untuk 3-4 dokumen yang dikirim bertahap).
post_max_size = 16M
; Jumlah maksimum file dalam satu request.
max_file_uploads = 10
; Memori untuk proses PHP (Livewire + DOM PDF memakan memori).
memory_limit = 256M